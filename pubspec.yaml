name: maslosoft_signals
description: >-
  Cross-component communication through annotated signal receivers and providers,
  with typed dispatch, filtering, and generated Dart registration code.
version: 0.1.0
homepage: https://maslosoft.com/signals/

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  analyzer: ^7.7.1
  args: ^2.6.0
  path: ^1.9.0

dev_dependencies:
  lints: ^5.1.1
  test: ^1.25.8

executables:
  signals: signals

topics:
  - signals
  - events
  - communication
  - code-generation
